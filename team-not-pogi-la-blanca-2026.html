<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Not Pogi La Blanca 2026 Results</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #151719;
      --muted: #5d646b;
      --line: #d9ded7;
      --accent: #0f766e;
      --accent-dark: #134e4a;
      --warn: #9f2d20;
      --th-bg: #eef3ef;
      --th-text: #28323a;
      --hover-bg: #f3faf7;
      --header-bg: #1f2933;
      --category-border: #afd6d0;
    }

    html.dark {
      color-scheme: dark;
      --bg: #0f1117;
      --panel: #1a1d27;
      --text: #e2e8f0;
      --muted: #8896a7;
      --line: #2d3448;
      --accent: #2dd4bf;
      --accent-dark: #99f6e4;
      --warn: #f87171;
      --th-bg: #1e2335;
      --th-text: #a0aec0;
      --hover-bg: #1e2a3a;
      --header-bg: #090c14;
      --category-border: #2dd4bf55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.45;
    }

    header {
      background: var(--header-bg);
      color: white;
      padding: 28px 20px 24px;
    }

    .header-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: #d7dee7;
      font-size: 0.95rem;
    }

    main {
      padding: 22px 0 34px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1.1fr) minmax(150px, 0.7fr) minmax(150px, 0.7fr) auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      min-height: 42px;
      padding: 9px 10px;
    }

    .toggle {
      align-items: center;
      display: flex;
      gap: 8px;
      min-height: 42px;
      padding: 0 2px;
      text-transform: none;
      color: var(--text);
      white-space: nowrap;
    }

    .toggle input {
      width: 18px;
      min-height: 18px;
      accent-color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--th-bg);
      color: var(--th-text);
      font-size: 0.78rem;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    .cell-position {
      width: 50px;
      min-width: 50px !important;
      max-width: 50px !important;
      text-align: center;
      color: var(--muted);
    }

    th.cell-position {
      cursor: default;
    }

    tbody tr:hover {
      background: var(--hover-bg);
    }

    .cell-rider-name {
      white-space: normal;
      min-width: 300px !important;
      max-width: 300px !important;
      line-break: anywhere !important;
    }

    .cell-team-name {
      min-width: 200px !important;
      max-width: 200px !important;
      line-break: anywhere !important;
    }

    .team-badge {
      display: inline-flex;
      border-radius: 999px;
      padding: 2px 10px;
      font-weight: 600;
      border: 1px solid transparent;
      font-size: 0.85rem;
    }

    .category {
      display: inline-flex;
      min-width: 42px;
      justify-content: center;
      border: 1px solid var(--category-border);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--accent-dark);
      font-weight: 700;
    }

    /* ── vElo badge ───────────────────────────────────── */
    .velo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 3px 10px 3px 3px;
      white-space: nowrap;
    }

    .velo-badge-ring {
      position: relative;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .velo-badge-ring svg {
      position: absolute;
      inset: 0;
    }

    .velo-badge-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1;
    }

    .velo-badge-score {
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
    }

    /* ── Dark mode toggle ─────────────────────────────── */
    .dark-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 6px 14px;
      color: white;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background 0.2s;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .dark-toggle:hover {
      background: rgba(255,255,255,0.18);
    }

    .dark-toggle-icon {
      font-size: 1rem;
      line-height: 1;
    }

    .missing {
      color: var(--muted);
    }

    .gc {
      font-weight: 750;
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 12px;
    }

    @media (max-width: 820px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .toggle {
        min-height: 28px;
      }
    }
  </style>
</head>

  </main>

"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"01:35:11","stage5Time":"-"},{"riderName":"eiji yama","veloCategory":"9 - Bronze","veloCategorySort":9,"veloScore":"826","team":"-","teamColor":"00dd00","teamBg":"-","gcTime":"01:36:55","gcSort":5815,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"01:36:55","stage5Time":"-"},{"riderName":"AL C SimpSimpHea","veloCategory":"6 - Platinum","veloCategorySort":6,"veloScore":"1150","team":"HERC","teamColor":"ffffff","teamBg":"ff007f","gcTime":"01:43:08","gcSort":6188,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"01:43:08","stage5Time":"-"},{"riderName":"Eduardo Rojas Rojas","veloCategory":"7 - Gold","veloCategorySort":7,"veloScore":"1118","team":"-","teamColor":"00dd00","teamBg":"-","gcTime":"01:44:17","gcSort":6257,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"01:44:17","stage5Time":"-"},{"riderName":"Park Jinhea3000[TEC]","veloCategory":"5 - Amethyst","veloCategorySort":5,"veloScore":"1358","team":"-","teamColor":"00dd00","teamBg":"-","gcTime":"01:44:17","gcSort":6257,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"01:44:17","stage5Time":"-"},{"riderName":"- TecK","veloCategory":"7 - Gold","veloCategorySort":7,"veloScore":"1072","team":"-","teamColor":"00dd00","teamBg":"-","gcTime":"01:47:43","gcSort":6463,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"01:47:43","stage5Time":"-"},{"riderName":"Fabio Capodei [SISU]","veloCategory":"8 - Silver","veloCategorySort":8,"veloScore":"856","team":"SISU Racing","teamColor":"ffffff","teamBg":"1f1582","gcTime":"01:55:13","gcSort":6913,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"01:55:13","stage5Time":"-"},{"riderName":"Andy Davy","veloCategory":"8 - Silver","veloCategorySort":8,"veloScore":"861","team":"Team Not Pogi","teamColor":"ff0000","teamBg":"ffffff","gcTime":"02:15:04","gcSort":8104,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"02:15:04","stage5Time":"-"},{"riderName":"J  Hauser (Seattle)","veloCategory":"10 - Copper","veloCategorySort":10,"veloScore":"579","team":"-","teamColor":"00dd00","teamBg":"-","gcTime":"02:37:40","gcSort":9460,"completedStages":1,"isComplete":false,"stage1Time":"-","stage2Time":"-","stage3Time":"-","stage4Time":"02:37:40","stage5Time":"-"}];

    // ── vElo badge configuration ──────────────────────
    const VELO = [
      { cat: 1,  name: 'Diamond',  color: '#82d5f7', bg: '#82d5f7', min: 2200, max: 5000 }, // uses 5000 as upper limit for the badge circle.
      { cat: 2,  name: 'Ruby',     color: '#9b111e', bg: '#9b111e', min: 1900, max: 2200 },
      { cat: 3,  name: 'Emerald',  color: '#009473', bg: '#009473', min: 1650, max: 1900 },
      { cat: 4,  name: 'Sapphire', color: '#0f52ba', bg: '#0f52ba', min: 1450, max: 1650 },
      { cat: 5,  name: 'Amethyst', color: '#9966cc', bg: '#9966cc', min: 1300, max: 1450 },
      { cat: 6,  name: 'Platinum', color: '#d8dfdf', bg: '#d8dfdf', min: 1150, max: 1300 },
      { cat: 7,  name: 'Gold',     color: '#d9b24e', bg: '#d9b24e', min: 1000, max: 1150 },
      { cat: 8,  name: 'Silver',   color: '#8e8e8e', bg: '#8e8e8e', min:  850, max: 1000 },
      { cat: 9,  name: 'Bronze',   color: '#754514', bg: '#754514', min:  650, max:  850 },
      { cat: 10, name: 'Copper',   color: '#f19269', bg: '#f19269', min:    0, max:  650 },
    ];
    const veloByNum = Object.fromEntries(VELO.map(v => [v.cat, v]));

    function veloBadge(row) {
      const catNum = row.veloCategorySort;
      const score  = parseInt(row.veloScore, 10);
      if (!catNum || isNaN(score)) return escapeHtml(row.veloScore || '-');

      const cfg = veloByNum[catNum] || veloByNum[10];
      const r = 12, cx = 16, cy = 16;
      const circ = 2 * Math.PI * r;
      let progress = Math.max(0, Math.min(1, (score - cfg.min) / (cfg.max - cfg.min)));
      const offset = circ * (1 - progress);

      return `<span class="velo-badge" style="background:${cfg.bg}" title="${cfg.name} – ${score} pts">
        <span class="velo-badge-ring">
          <svg width="32" height="32" viewBox="0 0 32 32">
            <circle cx="${cx}" cy="${cy}" r="16" fill="#ffffff" />
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
              stroke="${cfg.color}22" stroke-width="3.5" />
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
              stroke="${cfg.color}" stroke-width="3.5"
              stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
              stroke-linecap="round"
              transform="rotate(-90 ${cx} ${cy})" />
          </svg>
          <span class="velo-badge-num" style="color:${cfg.color}">${catNum}</span>
        </span>
        <span class="velo-badge-score">${score}</span>
      </span>`;
    }

    function decodeHtml(html) {
      const txt = document.createElement("textarea");
      txt.innerHTML = html;
      return txt.value;
    }
    results.forEach(row => {
      row.riderName = decodeHtml(row.riderName || "");
      row.team = decodeHtml(row.team || "");
    });

    const columns = ["stage1Time","stage2Time","stage3Time","stage4Time","stage5Time"];
    const state = {
      search: "",
      category: "",
      team: "",
      completeOnly: false,
      sortKey: "gcSort",
      sortDirection: "asc"
    };

    const body = document.querySelector("#results-body");
    const emptyState = document.querySelector("#empty-state");
    const resultCount = document.querySelector("#result-count");
    const searchInput = document.querySelector("#search");
    const categoryFilter = document.querySelector("#category-filter");
    const teamFilter = document.querySelector("#team-filter");
    const completeFilter = document.querySelector("#complete-filter");

    function uniqueValues(key) {
      return [...new Set(results.map(row => row[key]).filter(value => value && value !== "-"))]
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    function fillSelect(select, values) {
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.append(option);
      });
    }

    function compareRows(a, b) {
      if (state.sortKey === "gcSort") {
        const completedStageComparison = b.completedStages - a.completedStages;
        if (completedStageComparison !== 0) return completedStageComparison;
      }

      const aValue = a[state.sortKey];
      const bValue = b[state.sortKey];
      const direction = state.sortDirection === "asc" ? 1 : -1;

      if (aValue == null && bValue == null) return a.riderName.localeCompare(b.riderName);
      if (aValue == null) return 1;
      if (bValue == null) return -1;

      if (typeof aValue === "number" && typeof bValue === "number") {
        return (aValue - bValue) * direction;
      }

      return String(aValue).localeCompare(String(bValue), undefined, { numeric: true }) * direction;
    }

    function filteredRows() {
      const search = state.search.trim().toLowerCase();

      return results
        .filter(row => !state.category || row.veloCategory === state.category)
        .filter(row => !state.team || row.team === state.team)
        .filter(row => !state.completeOnly || row.isComplete)
        .filter(row => {
          if (!search) return true;
          return `${row.riderName} ${row.team}`.toLowerCase().includes(search);
        })
        .sort(compareRows);
    }

    function timeCell(value, extraClass = "") {
      const className = value === "-" ? `missing ${extraClass}` : extraClass;
      return `<td class="${className.trim()}">${value}</td>`;
    }

    function render() {
      const rows = filteredRows();
      resultCount.textContent = `${rows.length} of ${results.length} riders`;
      emptyState.hidden = rows.length > 0;

      body.innerHTML = rows.map((row, index) => `
        <tr>
          <td class="cell-position">${index + 1}</td>
          <td class="cell-rider-name">${escapeHtml(row.riderName)}</td>
          <td>${veloBadge(row)}</td>
          <td class="cell-team-name">
            ${row.team === '-' ? '-' : `<span class="team-badge" style="color: #${row.teamColor || '151719'}; background-color: #${row.teamBg || 'eef3ef'}; border-color: #${row.teamBg || 'afd6d0'};">${escapeHtml(row.team)}</span>`}
          </td>
          ${columns.map(column => timeCell(escapeHtml(row[column]))).join("")}
          ${timeCell(escapeHtml(row.gcTime), "gc")}
        </tr>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    fillSelect(categoryFilter, uniqueValues("veloCategory"));
    fillSelect(teamFilter, uniqueValues("team"));

    searchInput.addEventListener("input", event => {
      state.search = event.target.value;
      render();
    });

    categoryFilter.addEventListener("change", event => {
      state.category = event.target.value;
      render();
    });

    teamFilter.addEventListener("change", event => {
      state.team = event.target.value;
      render();
    });

    completeFilter.addEventListener("change", event => {
      state.completeOnly = event.target.checked;
      render();
    });

    document.querySelectorAll("th[data-sort]").forEach(header => {
      header.addEventListener("click", () => {
        const key = header.dataset.sort;
        if (state.sortKey === key) {
          state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = key;
          // velo score: default desc (highest first); gc: asc; others: asc
          state.sortDirection = key === "gcSort" ? "asc" : key === "veloScore" ? "desc" : "asc";
        }
        render();
      });
    });

    // ── Dark mode ──────────────────────────────────────
    const html = document.documentElement;
    const darkToggle = document.querySelector("#dark-toggle");
    const darkToggleIcon = document.querySelector("#dark-toggle-icon");
    const darkToggleLabel = document.querySelector("#dark-toggle-label");

    function applyDark(isDark) {
      html.classList.toggle("dark", isDark);
      darkToggleIcon.textContent = isDark ? "☀️" : "🌙";
      darkToggleLabel.textContent = isDark ? "Light mode" : "Dark mode";
      try { localStorage.setItem("sisu-dark", isDark ? "1" : "0"); } catch(e) {}
    }

    // Default to dark unless the user has explicitly chosen light
    const savedPref = (() => { try { return localStorage.getItem("sisu-dark"); } catch(e) { return null; } })();
    applyDark(savedPref === null ? true : savedPref === "1");

    darkToggle.addEventListener("click", () => applyDark(!html.classList.contains("dark")));

    render();
  </script>
</body>
